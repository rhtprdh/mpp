server:
  port: 8300

spring:
  application:
    name: inventory-service

  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/inventorydb
    username: postgres
    password: ADMIN@123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# below prop for tracing 
management:
  tracing:
    sampling:
      probability: 1.0   # capture 100% tracing data

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name}, %X{traceId}, %X{spanId}]" 
